<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advertisement Pop-up</title>
    <link rel="stylesheet" href="css/pop-up.css">
</head>
<body>
    <div id="popup" class="popup">
        <div class="popup-content">
            <span class="close-button" id="close-button">&times;</span>
            <h1 class="popup-title">ad</h1>
            <img src="backgrounds/tournament-2021.jpg" alt="Ad Image" class="popup-image">
            <p class="popup-info">Some information about the advertisement goes here. It's detailed and concise.</p>
            <a href="news.html" class="popup-link">Learn More</a>
        </div>
    </div>

    <script src="js/pop-up.js"></script>
</body>
</html>
